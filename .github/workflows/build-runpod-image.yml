name: Build RunPod worker image

# Builds Dockerfile.runpod for linux/amd64 on GitHub's native amd64 runners and
# pushes it to Docker Hub. Requires two repo secrets:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN    - a Docker Hub access token (write scope)
on:
  workflow_dispatch:
  push:
    branches: [main, feat/krea-runpod-training]
    paths:
      - Dockerfile.runpod
      - requirements.txt
      - requirements-runpod.txt
      - runpod_worker/**
      - fluxgym_core.py
      - .github/workflows/build-runpod-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup || true
          df -h /

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          # Single tag, no gha cache: this image is ~10GB and mode=max cache
          # export thrashes against GitHub's 10GB cache limit. Inline cache is
          # cheap and lets later builds reuse layers from the registry.
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fluxgym-runpod:latest
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fluxgym-runpod:latest
          cache-to: type=inline
          provenance: false
