name: Build RunPod worker image

# Builds Dockerfile.runpod for linux/amd64 on GitHub's native amd64 runners and
# pushes it to Docker Hub. Requires two repo secrets:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN    - a Docker Hub access token (write scope)
on:
  workflow_dispatch:
  push:
    branches: [main, feat/krea-runpod-training]
    paths:
      - Dockerfile.runpod
      - requirements.txt
      - requirements-runpod.txt
      - runpod/**
      - fluxgym_core.py
      - .github/workflows/build-runpod-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fluxgym-runpod:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fluxgym-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
